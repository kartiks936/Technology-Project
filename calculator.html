<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
      }

      .calculator {
        width: 320px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        padding: 20px;
      }

      .display {
        width: 100%;
        height: 70px;
        background: #1f2937;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 2rem;
        text-align: right;
        padding: 10px 15px;
        margin-bottom: 16px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 18px 10px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.96;
      }

      button:active {
        transform: scale(0.98);
      }

      .operator {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .number {
        background: #f3f4f6;
        color: #111827;
      }

      .equal {
        background: #22c55e;
        color: white;
      }

      .clear {
        background: #fecaca;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input class="display" id="display" type="text" readonly value="0" />

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendOperator('%')">%</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>

        <button class="number" onclick="appendNumber('7')">7</button>
        <button class="number" onclick="appendNumber('8')">8</button>
        <button class="number" onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button class="number" onclick="appendNumber('4')">4</button>
        <button class="number" onclick="appendNumber('5')">5</button>
        <button class="number" onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">−</button>

        <button class="number" onclick="appendNumber('1')">1</button>
        <button class="number" onclick="appendNumber('2')">2</button>
        <button class="number" onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button class="number" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
        <button class="number" onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculateResult()">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');
      let currentInput = '0';
      let firstValue = null;
      let operator = null;
      let waitingForSecondValue = false;

      function updateDisplay() {
        display.value = currentInput;
      }

      function clearDisplay() {
        currentInput = '0';
        firstValue = null;
        operator = null;
        waitingForSecondValue = false;
        updateDisplay();
      }

      function deleteLast() {
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
        updateDisplay();
      }

      function appendNumber(value) {
        if (waitingForSecondValue) {
          currentInput = value;
          waitingForSecondValue = false;
        } else {
          currentInput = currentInput === '0' ? value : currentInput + value;
        }
        updateDisplay();
      }

      function appendOperator(nextOperator) {
        const inputValue = parseFloat(currentInput);

        if (firstValue === null) {
          firstValue = inputValue;
        } else if (operator) {
          const result = performCalculation(firstValue, inputValue, operator);
          currentInput = String(result);
          firstValue = result;
        }

        waitingForSecondValue = true;
        operator = nextOperator;
        updateDisplay();
      }

      function performCalculation(first, second, op) {
        switch (op) {
          case '+':
            return first + second;
          case '-':
            return first - second;
          case '*':
            return first * second;
          case '/':
            return second === 0 ? 'Error' : first / second;
          case '%':
            return (first * second) / 100;
          default:
            return second;
        }
      }

      function calculateResult() {
        if (!operator || waitingForSecondValue) {
          return;
        }

        const secondValue = parseFloat(currentInput);
        const result = performCalculation(firstValue, secondValue, operator);

        currentInput = String(result);
        firstValue = null;
        operator = null;
        waitingForSecondValue = false;
        updateDisplay();
      }

      updateDisplay();
    </script>
  </body>
</html>
