<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #dfe9f3, #f6f9ff);
        font-family: Arial, Helvetica, sans-serif;
      }

      .calculator {
        width: 320px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        padding: 20px;
      }

      .display {
        width: 100%;
        height: 72px;
        border: none;
        border-radius: 12px;
        background: #1f2937;
        color: white;
        text-align: right;
        font-size: 2rem;
        padding: 12px 14px;
        margin-bottom: 16px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 18px 10px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.08s ease, opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.97;
      }

      button:active {
        transform: scale(0.98);
      }

      .number {
        background: #f3f4f6;
        color: #111827;
      }

      .operator {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .equal {
        background: #22c55e;
        color: white;
      }

      .clear {
        background: #fecaca;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input class="display" id="display" type="text" value="0" readonly />

      <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button class="operator" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="chooseOperator('%')">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button class="number" onclick="appendNumber('7')">7</button>
        <button class="number" onclick="appendNumber('8')">8</button>
        <button class="number" onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button class="number" onclick="appendNumber('4')">4</button>
        <button class="number" onclick="appendNumber('5')">5</button>
        <button class="number" onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button class="number" onclick="appendNumber('1')">1</button>
        <button class="number" onclick="appendNumber('2')">2</button>
        <button class="number" onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="number" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
        <button class="number" onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculateResult()">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');

      let displayValue = '0';
      let firstOperand = null;
      let operator = null;
      let waitingForSecondOperand = false;

      function updateDisplay() {
        display.value = displayValue;
      }

      function clearAll() {
        displayValue = '0';
        firstOperand = null;
        operator = null;
        waitingForSecondOperand = false;
        updateDisplay();
      }

      function deleteLast() {
        if (displayValue.length > 1) {
          displayValue = displayValue.slice(0, -1);
        } else {
          displayValue = '0';
        }
        updateDisplay();
      }

      function appendNumber(number) {
        if (displayValue === 'Error') {
          displayValue = '0';
        }

        if (waitingForSecondOperand) {
          displayValue = number;
          waitingForSecondOperand = false;
        } else {
          displayValue = displayValue === '0' ? number : displayValue + number;
        }

        updateDisplay();
      }

      function appendDecimal() {
        if (waitingForSecondOperand) {
          displayValue = '0.';
          waitingForSecondOperand = false;
        } else if (!displayValue.includes('.')) {
          displayValue += '.';
        }
        updateDisplay();
      }

      function chooseOperator(nextOperator) {
        const inputValue = Number(displayValue);

        if (displayValue === 'Error') {
          return;
        }

        if (firstOperand === null) {
          firstOperand = inputValue;
        } else if (operator) {
          const result = performCalculation(firstOperand, inputValue, operator);
          displayValue = String(result);
          firstOperand = result;
        }

        waitingForSecondOperand = true;
        operator = nextOperator;
        updateDisplay();
      }

      function performCalculation(first, second, op) {
        switch (op) {
          case '+':
            return first + second;
          case '-':
            return first - second;
          case '*':
            return first * second;
          case '/':
            return second === 0 ? 'Error' : first / second;
          case '%':
            return second === 0 ? 'Error' : first % second;
          default:
            return second;
        }
      }

      function calculateResult() {
        if (operator === null || waitingForSecondOperand) {
          return;
        }

        const secondOperand = Number(displayValue);
        const result = performCalculation(firstOperand, secondOperand, operator);

        displayValue = String(result);
        firstOperand = null;
        operator = null;
        waitingForSecondOperand = false;
        updateDisplay();
      }

      document.querySelector(".number[data-value='."]")?.addEventListener('click', appendDecimal);

      document.addEventListener('keydown', (event) => {
        if (/^[0-9]$/.test(event.key)) {
          appendNumber(event.key);
        }

        if (event.key === '.') {
          appendDecimal();
        }

        if (['+', '-', '*', '/'].includes(event.key)) {
          chooseOperator(event.key);
        }

        if (event.key === '%') {
          chooseOperator('%');
        }

        if (event.key === 'Enter' || event.key === '=') {
          calculateResult();
        }

        if (event.key === 'Backspace') {
          deleteLast();
        }

        if (event.key === 'Escape') {
          clearAll();
        }
      });

      updateDisplay();
    </script>
  </body>
</html>
